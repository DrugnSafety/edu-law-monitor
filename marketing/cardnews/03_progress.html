<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>03 진행 — 첫 관문을 넘었습니다</title>
    <link rel="stylesheet" href="cardnews.css" />
    <style>
      .prog-h {
        margin-top: 22px;
        font-size: 96px;
      }
      .prog-body {
        margin-top: 26px;
      }

      /* 개정안 묶음 → 위원회 대안 */
      .bundle {
        display: grid;
        grid-template-columns: auto 92px 1fr;
        align-items: center;
        column-gap: 18px;
        margin-top: 64px;
      }
      .piles {
        display: flex;
        flex-direction: column;
        gap: 30px;
      }
      .pile {
        display: flex;
        align-items: center;
        gap: 26px;
      }
      /* 개정안 1건 = 종이 1장 */
      .docs {
        display: flex;
        gap: 10px;
        width: 214px;
      }
      .docs i {
        width: 46px;
        height: 60px;
        padding: 12px 8px;
        border: 2.5px solid var(--ink-2);
        border-radius: 3px;
        background-color: var(--sheet);
        background-image: repeating-linear-gradient(to bottom, var(--ink-3) 0 2.5px, transparent 2.5px 9px);
        background-clip: content-box;
      }
      .pile p {
        font-size: 34px;
        line-height: 1.3;
        color: var(--ink-2);
      }
      .pile b {
        display: block;
        font-weight: 700;
        color: var(--ink);
      }
      .join {
        position: relative;
        align-self: stretch;
      }
      .join svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .alt {
        position: relative;
        height: 262px;
        padding: 30px 30px;
        border: 3px solid var(--ink);
        border-radius: 6px;
        background-color: var(--sheet);
        background-image: repeating-linear-gradient(to bottom, var(--rule-2) 0 3px, transparent 3px 22px);
        background-position: 0 128px;
        background-repeat: repeat-x;
        background-size: 100% 110px;
      }
      .alt__name {
        font-family: var(--serif);
        font-size: 54px;
        white-space: nowrap;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.15;
      }
      .alt .stamp {
        position: absolute;
        right: -22px;
        bottom: -30px;
        width: 140px;
        height: 140px;
      }

      .common {
        margin-top: 72px;
        padding: 26px 32px 28px;
        border: 2px solid var(--grid-line);
        border-radius: 8px;
        background: var(--sheet);
      }
      .common__k {
        font-size: 30px;
        font-weight: 700;
        color: var(--grid);
      }
      .common__v {
        margin-top: 8px;
        font-size: 40px;
        font-weight: 700;
        line-height: 1.45;
        color: var(--ink);
      }
      .common .note {
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1.5px dashed var(--rule);
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <filter id="ink" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>

    <main class="card">
      <header class="mast">
        <svg class="mast__seal" viewBox="0 0 40 40" aria-hidden="true">
          <g filter="url(#ink)">
            <rect x="1.5" y="1.5" width="37" height="37" rx="5" fill="#c3352b" />
            <rect x="5" y="5" width="30" height="30" rx="2.5" fill="none" stroke="#fff" stroke-opacity=".55" />
            <text x="20" y="27.5" text-anchor="middle" font-size="19" font-weight="700" fill="#fff" font-family="Gowun Batang, serif">12</text>
          </g>
        </svg>
        <span class="mast__name">교원 육아휴직 12세 입법 모니터</span>
        <span class="mast__page">3/6</span>
      </header>

      <section class="sheet">
        <p class="eyebrow tnum">2026년 11월 17일 · 국회 교육위원회</p>
        <h1 class="headline prog-h">첫 관문을 넘었습니다</h1>
        <p class="body prog-body">법안심사소위원회가 교육공무원법·사립학교법 개정안들을 <b>‘위원회 대안’으로 묶어 의결</b>했습니다.</p>

        <div class="bundle" role="img" aria-label="교육공무원법 개정안 4건과 사립학교법 개정안 3건을 위원회 대안으로 묶어 의결">
          <div class="piles">
            <div class="pile">
              <div class="docs" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
              <p><b>교육공무원법</b>개정안 4건</p>
            </div>
            <div class="pile">
              <div class="docs" aria-hidden="true"><i></i><i></i><i></i></div>
              <p><b>사립학교법</b>개정안 3건</p>
            </div>
          </div>
          <div class="join" aria-hidden="true">
            <svg viewBox="0 0 92 100" preserveAspectRatio="none">
              <path d="M2 14 H22 Q32 14 32 24 V76 Q32 86 22 86 H2" fill="none" stroke="#16213a" stroke-width="3" vector-effect="non-scaling-stroke" />
              <path d="M32 50 H84" fill="none" stroke="#16213a" stroke-width="3" vector-effect="non-scaling-stroke" />
            </svg>
            <svg viewBox="0 0 92 100" aria-hidden="true" style="overflow: visible">
              <path d="M74 50 m0 -9 L90 50 L74 59" fill="none" stroke="#16213a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
            </svg>
          </div>
          <div class="alt">
            <p class="alt__name">위원회 대안</p>
            <svg class="stamp" viewBox="0 0 100 100" aria-hidden="true">
              <g filter="url(#ink)" fill="none" stroke="currentColor">
                <circle cx="50" cy="50" r="45" stroke-width="6" />
                <circle cx="50" cy="50" r="36" stroke-width="2" />
                <text x="50" y="61" text-anchor="middle" font-size="30" font-weight="700" fill="currentColor" stroke="none" font-family="Gowun Batang, serif">의결</text>
              </g>
            </svg>
          </div>
        </div>

        <div class="common">
          <p class="common__k">개정안들의 공통 내용</p>
          <p class="common__v">대상 자녀를 <span class="marker">만 12세 이하 · 초6 이하</span>로 확대</p>
          <p class="note">※ 대안 조문은 아직 공개 전입니다. 사이트에서 확인되는 대로 업데이트합니다.</p>
        </div>
      </section>

      <footer class="foot">
        <span class="foot__url">edu-law-monitor.vercel.app</span>
      </footer>
    </main>
  </body>
</html>
