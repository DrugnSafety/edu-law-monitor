<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>01 표지 — 교원 육아휴직, 아직 ‘초2’까지입니다</title>
    <link rel="stylesheet" href="cardnews.css" />
    <style>
      .cover-h {
        margin-top: 26px;
        font-size: 108px;
      }
      .cover-sub {
        margin-top: 34px;
        font-size: 44px;
        line-height: 1.5;
        color: var(--ink-2);
      }
      .strip > div {
        height: 196px;
      }
      .strip .g {
        font-size: 96px;
      }
      .cover-sub b {
        font-weight: 700;
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <filter id="ink" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>

    <main class="card">
      <header class="mast">
        <svg class="mast__seal" viewBox="0 0 40 40" aria-hidden="true">
          <g filter="url(#ink)">
            <rect x="1.5" y="1.5" width="37" height="37" rx="5" fill="#c3352b" />
            <rect x="5" y="5" width="30" height="30" rx="2.5" fill="none" stroke="#fff" stroke-opacity=".55" />
            <text x="20" y="27.5" text-anchor="middle" font-size="19" font-weight="700" fill="#fff" font-family="Gowun Batang, serif">12</text>
          </g>
        </svg>
        <span class="mast__name">교원 육아휴직 12세 입법 모니터</span>
        <span class="mast__page">1/6</span>
      </header>

      <section class="sheet">
        <p class="eyebrow">육아휴직 대상 자녀, 초등학교 기준</p>
        <h1 class="headline cover-h">교원 육아휴직,<br />아직 ‘초2’까지입니다</h1>
        <p class="cover-sub">일반 공무원은 초6까지.<br /><b>교사만 멈춰 있습니다.</b></p>

        <figure class="push" aria-label="초등학교 1~6학년. 육아휴직 대상 자녀가 교원은 만 8세 이하 또는 초등 2학년 이하, 일반 공무원은 만 12세 이하·초등 6학년 이하입니다.">
          <div class="strip">
            <div class="is-cur"><span class="g">1</span><span class="u">학년</span></div>
            <div class="is-cur"><span class="g">2</span><span class="u">학년</span></div>
            <div class="is-new"><span class="q">?</span><span class="g">3</span><span class="u">학년</span></div>
            <div class="is-new"><span class="q">?</span><span class="g">4</span><span class="u">학년</span></div>
            <div class="is-new"><span class="q">?</span><span class="g">5</span><span class="u">학년</span></div>
            <div class="is-new"><span class="q">?</span><span class="g">6</span><span class="u">학년</span></div>
          </div>
          <div class="spans">
            <div style="grid-column: span 2">
              <div class="spans__bar"></div>
              <p class="spans__label"><b>교원</b> 초2까지</p>
            </div>
            <div style="grid-column: span 6">
              <div class="spans__bar"></div>
              <p class="spans__label"><b>일반 공무원</b> 초6까지 (2026년 6월부터)</p>
            </div>
          </div>
        </figure>
      </section>

      <footer class="foot">
        <span class="foot__url">edu-law-monitor.vercel.app</span>
        <span>옆으로 넘겨 보기 →</span>
      </footer>
    </main>
  </body>
</html>
